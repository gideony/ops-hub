<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg)"/>
  
  <!-- Header Window -->
  <rect width="1000" height="44" rx="16" fill="#0b1120"/>
  <rect y="32" width="1000" height="12" fill="#0b1120"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="500" y="27" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">OPSHUB — Chat da Equipe em Tempo Real &amp; Menções</text>

  <!-- Sidebar Channels -->
  <g transform="translate(40, 60)">
    <rect width="240" height="430" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="700">Canais da Equipe</text>
    <rect x="194" y="16" width="26" height="24" rx="6" fill="#1e293b"/>
    <text x="207" y="32" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">+</text>

    <!-- Channel Item Active: #geral -->
    <g transform="translate(12, 54)">
      <rect width="216" height="40" rx="8" fill="#3b82f6"/>
      <text x="16" y="25" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600"># geral</text>
      <rect x="180" y="10" width="22" height="20" rx="10" fill="#ffffff"/>
      <text x="191" y="24" fill="#1e40af" font-size="10" font-weight="bold" text-anchor="middle">3</text>
    </g>

    <!-- Channel Item: #implantacao -->
    <g transform="translate(12, 102)">
      <rect width="216" height="40" rx="8" fill="#1e293b" fill-opacity="0.5"/>
      <text x="16" y="25" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif"># implantação</text>
      <rect x="176" y="10" width="26" height="20" rx="10" fill="#ef4444"/>
      <text x="189" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">@1</text>
    </g>

    <!-- Channel Item: #suporte-n1 -->
    <g transform="translate(12, 150)">
      <rect width="216" height="40" rx="8" fill="transparent"/>
      <text x="16" y="25" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif"># suporte-n1</text>
    </g>

    <!-- Channel Item: #comercial -->
    <g transform="translate(12, 198)">
      <rect width="216" height="40" rx="8" fill="transparent"/>
      <text x="16" y="25" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif"># comercial</text>
    </g>
  </g>

  <!-- Chat Conversation Area -->
  <g transform="translate(300, 60)">
    <rect width="660" height="430" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Channel Top Header -->
    <rect width="660" height="50" rx="12" fill="#1e293b"/>
    <rect y="38" width="660" height="12" fill="#1e293b"/>
    <text x="24" y="30" fill="#ffffff" font-size="15" font-family="system-ui, sans-serif" font-weight="700"># geral</text>
    <text x="80" y="30" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">· Comunicação oficial da organização</text>

    <!-- Messages Container -->
    <!-- Message 1 -->
    <g transform="translate(24, 76)">
      <circle cx="18" cy="18" r="18" fill="#6366f1"/>
      <text x="18" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">GE</text>
      <text x="46" y="16" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Gideony Ewerton</text>
      <text x="164" y="16" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Hoje às 10:15</text>
      <rect x="46" y="26" width="440" height="44" rx="8" fill="#1e293b"/>
      <text x="60" y="52" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">Atenção <tspan fill="#60a5fa" font-weight="bold">@todos</tspan>, acabamos de liberar a nova release do OPSHUB!</text>
    </g>

    <!-- Message 2 (Mention) -->
    <g transform="translate(24, 156)">
      <circle cx="18" cy="18" r="18" fill="#10b981"/>
      <text x="18" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">AL</text>
      <text x="46" y="16" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Aline Lima</text>
      <text x="120" y="16" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Hoje às 10:20</text>
      <rect x="46" y="26" width="510" height="54" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="60" y="50" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif"><tspan fill="#60a5fa" font-weight="bold">@Gideony</tspan> Excelente! As migrações automáticas já foram aplicadas</text>
      <text x="60" y="68" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">e todos os 313 testes de integração estão verdes.</text>
    </g>

    <!-- Input Bar -->
    <g transform="translate(24, 360)">
      <rect width="612" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="29" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Digite sua mensagem... Use @ para mencionar pessoas ou canais</text>
      <rect x="548" y="8" width="52" height="32" rx="6" fill="#3b82f6"/>
      <text x="574" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Enviar</text>
    </g>
  </g>
</svg>