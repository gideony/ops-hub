<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg)"/>
  
  <!-- Header Window -->
  <rect width="1000" height="44" rx="16" fill="#0b1120"/>
  <rect y="32" width="1000" height="12" fill="#0b1120"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="500" y="27" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">OPSHUB — Relatórios &amp; Analytics por Dimensão de Quadro</text>

  <!-- Controls Bar -->
  <g transform="translate(40, 64)">
    <text x="0" y="20" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="700">Resumo Comparativo por Quadro</text>
    <text x="0" y="38" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Status mutuamente exclusivos e exportação para CSV formatada para o Excel</text>

    <!-- Period Presets -->
    <rect x="520" y="4" width="220" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="546" y="25" fill="#60a5fa" font-size="12" font-weight="600">Hoje</text>
    <text x="600" y="25" fill="#94a3b8" font-size="12">Esta Semana</text>
    <text x="690" y="25" fill="#94a3b8" font-size="12">Mês</text>

    <!-- Export Button -->
    <rect x="760" y="4" width="160" height="34" rx="6" fill="#10b981"/>
    <text x="840" y="25" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">⬇ Exportar CSV</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(40, 126)" filter="url(#shadow)">
    <rect width="920" height="340" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect width="920" height="42" rx="10" fill="#1e293b"/>
    <rect y="32" width="920" height="10" fill="#1e293b"/>
    <text x="24" y="26" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" font-weight="600">QUADRO OPERACIONAL</text>
    <text x="260" y="26" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" font-weight="600">TIPO</text>
    <text x="360" y="26" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">TOTAL</text>
    <text x="440" y="26" fill="#60a5fa" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">EM ANDAMENTO</text>
    <text x="540" y="26" fill="#fbbf24" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">PAUSADAS</text>
    <text x="640" y="26" fill="#4ade80" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">CONCLUÍDAS</text>
    <text x="740" y="26" fill="#f87171" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">ATRASADAS</text>
    <text x="840" y="26" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">PROGRESSO</text>

    <!-- Row 1: Implantação -->
    <g transform="translate(0, 42)">
      <line x1="0" y1="48" x2="920" y2="48" stroke="#1e293b"/>
      <circle cx="28" cy="24" r="6" fill="#3b82f6"/>
      <text x="42" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Implantação de Clientes</text>
      <text x="260" y="28" fill="#94a3b8" font-size="12">Kanban</text>
      <text x="360" y="28" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">24</text>
      <text x="440" y="28" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">9</text>
      <text x="540" y="28" fill="#fbbf24" font-size="13" text-anchor="middle">2</text>
      <text x="640" y="28" fill="#4ade80" font-size="13" font-weight="600" text-anchor="middle">13</text>
      <text x="740" y="28" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <!-- Progress Bar -->
      <rect x="800" y="20" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="800" y="20" width="44" height="8" rx="4" fill="#3b82f6"/>
    </g>

    <!-- Row 2: Suporte N1 -->
    <g transform="translate(0, 90)">
      <line x1="0" y1="48" x2="920" y2="48" stroke="#1e293b"/>
      <circle cx="28" cy="24" r="6" fill="#10b981"/>
      <text x="42" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Suporte Técnico N1</text>
      <text x="260" y="28" fill="#94a3b8" font-size="12">Kanban</text>
      <text x="360" y="28" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">48</text>
      <text x="440" y="28" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">14</text>
      <text x="540" y="28" fill="#fbbf24" font-size="13" text-anchor="middle">1</text>
      <text x="640" y="28" fill="#4ade80" font-size="13" font-weight="600" text-anchor="middle">33</text>
      <text x="740" y="28" fill="#94a3b8" font-size="13" text-anchor="middle">0</text>
      <rect x="800" y="20" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="800" y="20" width="55" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Row 3: Backlog de Produto (Scrum) -->
    <g transform="translate(0, 138)">
      <line x1="0" y1="48" x2="920" y2="48" stroke="#1e293b"/>
      <circle cx="28" cy="24" r="6" fill="#8b5cf6"/>
      <text x="42" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Backlog de Produto</text>
      <text x="260" y="28" fill="#94a3b8" font-size="12">Scrum (64 pts)</text>
      <text x="360" y="28" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">32</text>
      <text x="440" y="28" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle">11</text>
      <text x="540" y="28" fill="#fbbf24" font-size="13" text-anchor="middle">2</text>
      <text x="640" y="28" fill="#4ade80" font-size="13" font-weight="600" text-anchor="middle">19</text>
      <text x="740" y="28" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <rect x="800" y="20" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="800" y="20" width="48" height="8" rx="4" fill="#8b5cf6"/>
    </g>

    <!-- Total Consolidado Footer -->
    <g transform="translate(0, 280)">
      <rect width="920" height="60" rx="0" fill="#0b1120"/>
      <text x="24" y="34" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="700">TOTAL CONSOLIDADO (SEM DUPLICIDADE)</text>
      <text x="360" y="34" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">104</text>
      <text x="440" y="34" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">34</text>
      <text x="540" y="34" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">5</text>
      <text x="640" y="34" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">65</text>
      <text x="740" y="34" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="840" y="34" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">62.5%</text>
    </g>
  </g>
</svg>