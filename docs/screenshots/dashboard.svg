<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bg)"/>
  
  <!-- Window Header -->
  <rect width="1000" height="44" rx="16" fill="#0b1120"/>
  <rect y="32" width="1000" height="12" fill="#0b1120"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="500" y="27" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">OPSHUB — Dashboard Operacional &amp; KPIs</text>

  <!-- Topbar / Greeting -->
  <g transform="translate(40, 64)">
    <text x="0" y="22" fill="#ffffff" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700">Bom dia, Gestor</text>
    <text x="0" y="42" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif">Visão panorâmica de quadros, sprints ativas e capacidade operacional</text>
    <rect x="760" y="8" width="160" height="34" rx="8" fill="url(#accent)"/>
    <text x="840" y="30" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">+ Nova Tarefa</text>
  </g>

  <!-- Metric KPI Cards -->
  <g transform="translate(40, 130)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="168" height="96" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Minhas Tarefas</text>
      <text x="16" y="66" fill="#ffffff" font-size="28" font-family="system-ui, sans-serif" font-weight="700">12</text>
      <rect x="116" y="20" width="36" height="20" rx="10" fill="#1e3a8a"/>
      <text x="134" y="34" fill="#60a5fa" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">+2</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(188, 0)" filter="url(#shadow)">
      <rect width="168" height="96" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Atrasadas</text>
      <text x="16" y="66" fill="#f87171" font-size="28" font-family="system-ui, sans-serif" font-weight="700">2</text>
      <rect x="110" y="20" width="42" height="20" rx="10" fill="#7f1d1d"/>
      <text x="131" y="34" fill="#fca5a5" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Atenção</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(376, 0)" filter="url(#shadow)">
      <rect width="168" height="96" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Em Andamento</text>
      <text x="16" y="66" fill="#60a5fa" font-size="28" font-family="system-ui, sans-serif" font-weight="700">38</text>
      <rect x="116" y="20" width="36" height="20" rx="10" fill="#1e293b"/>
      <text x="134" y="34" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">WIP</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(564, 0)" filter="url(#shadow)">
      <rect width="168" height="96" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Pausadas</text>
      <text x="16" y="66" fill="#fbbf24" font-size="28" font-family="system-ui, sans-serif" font-weight="700">5</text>
      <rect x="108" y="20" width="44" height="20" rx="10" fill="#78350f"/>
      <text x="130" y="34" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Espera</text>
    </g>

    <!-- KPI 5 -->
    <g transform="translate(752, 0)" filter="url(#shadow)">
      <rect width="168" height="96" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="500">Concluídas (Semana)</text>
      <text x="16" y="66" fill="#4ade80" font-size="28" font-family="system-ui, sans-serif" font-weight="700">27</text>
      <rect x="112" y="20" width="40" height="20" rx="10" fill="#14532d"/>
      <text x="132" y="34" fill="#86efac" font-size="10" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">+18%</text>
    </g>
  </g>

  <!-- Split Sections: Active Sprint & WIP Alert -->
  <g transform="translate(40, 246)">
    <!-- Sprint Widget -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="544" height="234" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="24" y="34" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Sprint Ativa — Desenvolvimento v2.4</text>
      <text x="24" y="56" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Quadro: Backlog de Produto · 14 de 21 dias restantes</text>
      
      <!-- Progress Bar -->
      <rect x="24" y="78" width="496" height="12" rx="6" fill="#334155"/>
      <rect x="24" y="78" width="320" height="12" rx="6" fill="url(#accent)"/>
      <text x="24" y="112" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">Meta: Entregar chat de equipe e refatoração de RLS</text>
      <text x="440" y="112" fill="#60a5fa" font-size="12" font-family="system-ui, sans-serif" font-weight="600">65% concluído</text>

      <!-- Mini stats -->
      <rect x="24" y="132" width="154" height="74" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="40" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Story Points</text>
      <text x="40" y="186" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="700">42 / 64</text>

      <rect x="195" y="132" width="154" height="74" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="211" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Demandas</text>
      <text x="211" y="186" fill="#ffffff" font-size="20" font-family="system-ui, sans-serif" font-weight="700">18 tarefas</text>

      <rect x="366" y="132" width="154" height="74" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="382" y="156" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Velocidade</text>
      <text x="382" y="186" fill="#4ade80" font-size="20" font-family="system-ui, sans-serif" font-weight="700">14 pts/sem</text>
    </g>

    <!-- Capacity & WIP Warnings -->
    <g transform="translate(564, 0)" filter="url(#shadow)">
      <rect width="356" height="234" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="24" y="34" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" font-weight="700">Gargalos &amp; Alertas WIP</text>
      
      <!-- Warning 1 -->
      <g transform="translate(24, 52)">
        <rect width="308" height="66" rx="8" fill="#78350f" fill-opacity="0.3" stroke="#d97706" stroke-width="1"/>
        <circle cx="24" cy="33" r="10" fill="#f59e0b"/>
        <text x="24" y="37" fill="#000" font-size="11" font-weight="bold" text-anchor="middle">!</text>
        <text x="44" y="28" fill="#fde68a" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Quadro Implantação: Validação</text>
        <text x="44" y="46" fill="#fcd34d" font-size="11" font-family="system-ui, sans-serif">Limite WIP excedido: 5 / 3 tarefas ativas</text>
      </g>

      <!-- Warning 2 -->
      <g transform="translate(24, 130)">
        <rect width="308" height="66" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <circle cx="24" cy="33" r="10" fill="#3b82f6"/>
        <text x="24" y="37" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">i</text>
        <text x="44" y="28" fill="#e2e8f0" font-size="12" font-family="system-ui, sans-serif" font-weight="600">3 Tarefas sem Responsável</text>
        <text x="44" y="46" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Equipe Suporte N1 aguardando triagem</text>
      </g>
    </g>
  </g>
</svg>