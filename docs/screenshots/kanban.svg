<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg)"/>
  
  <!-- Header Window -->
  <rect width="1000" height="44" rx="16" fill="#0b1120"/>
  <rect y="32" width="1000" height="12" fill="#0b1120"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="500" y="27" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">OPSHUB — Tarefas &amp; Quadros Personalizados (Kanban &amp; Scrum)</text>

  <!-- Board Tabs Bar -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="110" height="34" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="55" y="22" fill="#60a5fa" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Geral</text>
    
    <rect x="118" y="0" width="130" height="34" rx="6" fill="#3b82f6"/>
    <text x="183" y="22" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Implantação</text>
    
    <rect x="256" y="0" width="120" height="34" rx="6" fill="#1e293b"/>
    <text x="316" y="22" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="500" text-anchor="middle">Comercial</text>

    <rect x="384" y="0" width="130" height="34" rx="6" fill="#1e293b"/>
    <text x="449" y="22" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" font-weight="500" text-anchor="middle">Backlog (Scrum)</text>

    <rect x="522" y="0" width="110" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="577" y="22" fill="#64748b" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">+ Novo quadro</text>

    <!-- View switcher -->
    <rect x="760" y="0" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <rect x="762" y="2" width="76" height="30" rx="4" fill="#1e293b"/>
    <text x="800" y="22" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Kanban</text>
    <text x="880" y="22" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Lista</text>
  </g>

  <!-- Kanban Columns -->
  <g transform="translate(40, 114)">
    <!-- Column 1: A Fazer -->
    <g transform="translate(0, 0)">
      <rect width="216" height="376" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#3b82f6"/>
      <text x="34" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">A Fazer</text>
      <rect x="176" y="16" width="24" height="18" rx="9" fill="#1e293b"/>
      <text x="188" y="29" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">4</text>

      <!-- Task Card 1 -->
      <g transform="translate(12, 48)" filter="url(#cardShadow)">
        <rect width="192" height="92" rx="8" fill="url(#cardGrad)" stroke="#334155"/>
        <rect x="12" y="12" width="60" height="16" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="42" y="24" fill="#60a5fa" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">PROVEDOR X</text>
        <text x="12" y="46" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Configuração OLT &amp; Radius</text>
        <text x="12" y="66" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Subtarefas: 2/4</text>
        <circle cx="168" cy="74" r="10" fill="#6366f1"/>
        <text x="168" y="78" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">GE</text>
      </g>

      <!-- Task Card 2 -->
      <g transform="translate(12, 150)" filter="url(#cardShadow)">
        <rect width="192" height="84" rx="8" fill="url(#cardGrad)" stroke="#334155"/>
        <rect x="12" y="12" width="50" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="37" y="24" fill="#34d399" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FIBRA NET</text>
        <text x="12" y="46" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Validação de DNS e BGP</text>
        <circle cx="168" cy="66" r="10" fill="#ec4899"/>
        <text x="168" y="70" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">AL</text>
      </g>
    </g>

    <!-- Column 2: Em Andamento -->
    <g transform="translate(236, 0)">
      <rect width="216" height="376" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#f59e0b"/>
      <text x="34" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Em Andamento</text>
      <rect x="156" y="16" width="44" height="18" rx="9" fill="#78350f"/>
      <text x="178" y="29" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">3 / 3 WIP</text>

      <!-- Task Card Active -->
      <g transform="translate(12, 48)" filter="url(#cardShadow)">
        <rect width="192" height="110" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="12" y="12" width="64" height="16" rx="4" fill="#ef4444" fill-opacity="0.2"/>
        <text x="44" y="24" fill="#f87171" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">ALTA PRIORIDADE</text>
        <text x="12" y="46" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Homologação de App Mobile</text>
        <text x="12" y="66" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Publicação Google Play &amp; Apple</text>
        <rect x="12" y="78" width="120" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="78" width="90" height="6" rx="3" fill="#3b82f6"/>
        <circle cx="168" cy="92" r="10" fill="#8b5cf6"/>
        <text x="168" y="96" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">RN</text>
      </g>
    </g>

    <!-- Column 3: Validação -->
    <g transform="translate(472, 0)">
      <rect width="216" height="376" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#8b5cf6"/>
      <text x="34" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Validação</text>
      <rect x="176" y="16" width="24" height="18" rx="9" fill="#1e293b"/>
      <text x="188" y="29" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">2</text>

      <g transform="translate(12, 48)" filter="url(#cardShadow)">
        <rect width="192" height="92" rx="8" fill="url(#cardGrad)" stroke="#334155"/>
        <rect x="12" y="12" width="60" height="16" rx="4" fill="#8b5cf6" fill-opacity="0.2"/>
        <text x="42" y="24" fill="#c084fc" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">CONECTA MAIS</text>
        <text x="12" y="46" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Treinamento de Equipe N1</text>
        <text x="12" y="66" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Prazo: Hoje às 17h</text>
        <circle cx="168" cy="74" r="10" fill="#10b981"/>
        <text x="168" y="78" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">TH</text>
      </g>
    </g>

    <!-- Column 4: Concluído (com Ramificação) -->
    <g transform="translate(708, 0)">
      <rect width="212" height="376" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#10b981"/>
      <text x="34" y="28" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif" font-weight="600">Concluído</text>
      <rect x="172" y="16" width="24" height="18" rx="9" fill="#14532d"/>
      <text x="184" y="29" fill="#86efac" font-size="10" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">15</text>

      <g transform="translate(10, 48)" filter="url(#cardShadow)">
        <rect width="192" height="106" rx="8" fill="url(#cardGrad)" stroke="#1e293b"/>
        <rect x="12" y="12" width="50" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="37" y="24" fill="#4ade80" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FINALIZADA</text>
        <text x="12" y="46" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Deploy Produção Provedor Z</text>
        
        <!-- Forwarding tag badge -->
        <rect x="12" y="64" width="168" height="20" rx="4" fill="#1e3a8a"/>
        <text x="20" y="78" fill="#93c5fd" font-size="10" font-family="system-ui, sans-serif">➔ Encaminhada: Suporte N1</text>
      </g>
    </g>
  </g>
</svg>